name: tests

# Decode the captured fixtures (tests/pcap/) with the dissector and assert each
# decodes cleanly and covers the request types expected for its Tarantool
# version. Guards against regressions in either protocol path.

on:
  push:
    branches: [master]
  pull_request:

jobs:
  dissect:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Wireshark 4.x (noble)
            jammy: false
          - name: Wireshark 3.x (jammy)
            jammy: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Install tshark
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          if ${{ matrix.jammy }}; then
            echo "deb http://archive.ubuntu.com/ubuntu jammy main universe" \
              | sudo tee /etc/apt/sources.list.d/jammy.list
            sudo apt-get update -qq
            sudo apt-get install -y -qq -t jammy tshark
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq tshark
          fi

      - name: Show tshark version
        run: tshark --version | head -1

      - name: Build the amalgamated dissector
        run: sh amalgamate.sh

      # The Go suite discovers both install forms -- the amalgamated build just
      # built above and the modular src/ loader -- and runs every fixture
      # scenario against each. REQUIRE_AMALGAMATED makes a missing dist/ build a
      # hard failure rather than a silent modular-only run.
      - name: Run the dissector test suite
        env:
          REQUIRE_AMALGAMATED: "1"
        run: go test ./tests/ -v
